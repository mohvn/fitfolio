name: Deploy Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key secret is empty"
              exit 1
            fi
            val="${!key}"
            echo "$key is set (length ${#val})"
          done

      - name: Write .vercel/project.json
        run: |
          mkdir -p .vercel
          printf '%s\n' "{
            \"orgId\": \"$VERCEL_ORG_ID\",
            \"projectId\": \"$VERCEL_PROJECT_ID\"
          }" > .vercel/project.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.txt
          else
            vercel deploy --yes --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.txt
          fi
          url=$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (!url) return;
            const body = `Preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.startsWith('Preview:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
